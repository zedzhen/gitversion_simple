[build-system]
requires = [
    "setuptools>=81.0.0",
    "gitversion_simple~=2.0",
]

[project]
name = "gitversion_simple_setuptools"
description = "setuptools entry points for gitversion_simple"
readme = "readme.md"
requires-python = ">=3.10"
license = "Zlib"
license-files = ["LICENSE"]
authors = [
    { name = "Ярыкин Евгений", email = "pypi@zedzhen.ru" }
]
dynamic = ["version"]

[project.urls]
source = "https://github.com/zedzhen/gitversion_simple"

[dependency-groups]
dev = [
    'black~=26.5',
    'isort~=8.0',
    "build==1.5.*",
    "pre-commit~=4.6",
]

[project.entry-points."setuptools.finalize_distribution_options"]
gitversion_simple = "gitversion_simple.integrations.setuptools_:finalize_distribution_options"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
combine_as_imports = true

[tool.gitversion_simple]
vcs_root = "../.."
