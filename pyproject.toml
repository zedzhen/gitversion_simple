[build-system]
requires = [
    "packaging~=26.1",
    "setuptools~=82.0",
    "tomli~=2.0; python_version<'3.11'",
    "typing-extensions~=4.14",
    "vcs-versioning~=1.1",
]

[project]
name = "gitversion-simple"
description = "A simple version based on git/gh."
readme = "readme.md"
license = "Zlib"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
dynamic = [ "dependencies", "optional-dependencies", "version" ]
[[project.authors]]
name = "Ярыкин Евгений"
email = "pypi@zedzhen.ru"
[project.urls]
source = "https://github.com/zedzhen/gitversion_simple"

[dependency-groups]
dev = [
    "black~=26.5",
    "build==1.5.*",
    "isort~=8.0",
    "pre-commit~=4.6",
    "pyproject-fmt~=2.25",
    "setuptools~=82.0",
    { include-group = "types" },
]
requires = [
    "packaging~=26.1",
    "tomli~=2.0; python_version<'3.11'",
    "typing-extensions~=4.14",
    "vcs-versioning~=1.1",
]
types = [
    "mypy~=2.1",
    "tomli~=2.0",
    "types-setuptools~=82.0",
    { include-group = "requires" },
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
combine_as_imports = true
src_paths = [ "src" ]

[tool.mypy]
mypy_path = "src"
files = [ "src", "tools" ]
python_version = "3.10"
warn_unreachable = true
implicit_reexport = false
strict = true
[[tool.mypy.overrides]]
module = [ "vcs_versioning", "vcs_versioning.*" ]
follow_untyped_imports = true
