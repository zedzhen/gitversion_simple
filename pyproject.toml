[build-system]
requires = [
    "packaging~=26.1",
    "setuptools~=82.0",
    "tomli~=2.0; python_version<'3.11'",
    "typing-extensions~=4.14",
    "vcs-versioning~=1.1",
]

[project]
name = "gitversion-simple"
description = "A simple version based on git/gh."
readme = "readme.md"
license = "Zlib"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
dynamic = [ "optional-dependencies", "version" ]
dependencies = [
    "packaging~=26.1",
    "tomli~=2.0; python_version<'3.11'",
    "typing-extensions~=4.14",
    "vcs-versioning~=1.1",
]
[[project.authors]]
name = "Ярыкин Евгений"
email = "pypi@zedzhen.ru"
[project.urls]
source = "https://github.com/zedzhen/gitversion_simple"

[dependency-groups]
dev = [
    "black~=26.5",
    "build==1.5.*",
    "isort~=8.0",
    "pre-commit~=4.6",
    "pyproject-fmt~=2.25",
    "setuptools~=82.0",
]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
combine_as_imports = true

[tool.pyproject-fmt]
column_width = 120
indent = 4
generate_python_version_classifiers = false
table_format = "long"
